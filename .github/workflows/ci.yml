name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  e2e:
    name: Browser tests (Playwright)
    needs: frontend
    runs-on: ubuntu-latest
    env:
      PORT: "8000"
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Seed demo data and start FinVault
        working-directory: backend
        run: |
          export FINVAULT_DATA_DIR="$(mktemp -d)"
          python -m scripts.demo_seed
          nohup python scripts/serve_local.py > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS "$E2E_BASE_URL/api/health" && exit 0
            sleep 1
          done
          echo "Server did not start"; cat "$RUNNER_TEMP/server.log"; exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finvault:ci .

      - name: Tesseract is installed
        run: docker run --rm finvault:ci tesseract --version

      - name: Smoke test
        run: |
          docker volume create finvault-ci-data
          docker run -d --name finvault -p 8000:8000 -v finvault-ci-data:/data finvault:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health | grep -q '"ok":true'; then
              echo "FinVault is up"; exit 0
            fi
            sleep 2
          done
          echo "Health check never returned ok"; docker logs finvault; exit 1

      - name: Container log
        if: always()
        run: docker logs finvault || true
